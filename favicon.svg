<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fons circular fosc per a contrast a la pestanya -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
    
    <!-- Filtre de resplendor -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fons base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Estructura visual de l'ió / nombre d'oxidació -->
  <g filter="url(#glow)">
    <!-- Orbitals/Nivell d'electrons puntejats -->
    <circle cx="256" cy="256" r="110" fill="none" stroke="#94a3b8" stroke-width="8" stroke-dasharray="14 10"/>
    
    <!-- Símbol de l'element genèric (X) -->
    <text x="230" y="295" font-family="Arial, sans-serif" font-size="120" fill="#f8fafc" text-anchor="middle" font-weight="bold">X</text>
    
    <!-- Càrrega d'oxidació positiva (+2) en superíndex -->
    <g transform="translate(345, 160)">
      <circle cx="0" cy="0" r="52" fill="#38bdf8"/>
      <text x="0" y="14" font-family="Arial, sans-serif" font-size="44" fill="#0f172a" text-anchor="middle" font-weight="900">+2</text>
    </g>
    
    <!-- Càrrega d'oxidació negativa (-1) en subíndex o fons -->
    <g transform="translate(165, 365)">
      <circle cx="0" cy="0" r="45" fill="#f43f5e"/>
      <text x="0" y="12" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" font-weight="900">-1</text>
    </g>
  </g>
</svg>
